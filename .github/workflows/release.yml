name: Package Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已推送的版本标签，例如 v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo '版本标签应为 v1.0.0 或 v1.0.0-beta.1 等格式。' >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Package tracked project files
        shell: bash
        run: |
          package_name="${GITHUB_REPOSITORY##*/}-${RELEASE_TAG}"
          mkdir -p dist
          # 直接归档标签对应的提交，避免把依赖、缓存和生成结果混入发行包。
          git archive --format=zip --prefix="${package_name}/" \
            --output="dist/${package_name}.zip" HEAD
          cd dist
          sha256sum "${package_name}.zip" > "${package_name}.zip.sha256"

      - name: Publish release assets
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            # 重跑时更新同名附件，不重复创建 Release。
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            release_options=(--verify-tag --title "$RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/* "${release_options[@]}"
          fi
