<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>喵喵合唱 · 对轴设置</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9f2ee;color:#243e39;font:15px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}p{line-height:1.6;margin:8px 0 16px}a{color:#28675d}iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#53c8df}.panel{background:#fff;border:1px solid #d7e6df;border-radius:12px;padding:18px;margin-top:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}button,select,input[type=number]{font:inherit;border-radius:7px}button{padding:9px 14px;border:0;background:#367c70;color:white;cursor:pointer}button.secondary{background:#e8f1ed;color:#294d43}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #62bca7;outline-offset:2px}input[type=number]{padding:8px;border:1px solid #bdcfc6;width:105px}input[type=range]{accent-color:#367c70;width:100%;cursor:pointer}select{padding:8px;border:1px solid #bdcfc6;background:white}.timeline{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin:14px 0}.time{font-variant-numeric:tabular-nums}.loop{margin-top:14px;padding-top:14px;border-top:1px solid #e3eae6}.timings{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.timing-card{border:1px solid #d7e6df;border-radius:9px;padding:16px}.timing-card h3{font-size:17px;margin:0 0 6px}.hint{color:#5b736a;font-size:13px}.timing-card .description{min-height:40px}.timing-card input[type=number]{width:90px}.timing-card output{display:block;margin-top:8px}.save{margin-top:16px}.characters{display:block;width:100%;margin-top:20px;border-radius:12px}details{margin-top:16px}summary{cursor:pointer}#status{min-height:24px;margin-top:12px;color:#306754}#effective-offsets{margin-top:14px}.keyboard{margin-top:10px}input[type=checkbox]{accent-color:#367c70}@media(max-width:850px){main{padding:14px}.timings{grid-template-columns:1fr}.timing-card .description{min-height:0}.timeline{grid-template-columns:1fr}h1{font-size:22px}}
</style>
<style>
.workspace{display:grid;grid-template-columns:minmax(0,1fr)350px;gap:18px;align-items:start}.preview-column{position:sticky;top:16px;min-width:0}.timing-panel{margin-top:0}.timing-panel .timings{grid-template-columns:1fr}.timing-panel .description{min-height:0;margin-bottom:8px}.timing-panel .timing-card{padding:12px}.timing-panel .save button{flex:1}.preview-column .panel{padding:14px}.preview-column .row{gap:8px}.preview-column button{padding:8px 11px}.preview-column .keyboard{margin-bottom:0}@media(max-width:1050px){.workspace{grid-template-columns:minmax(0,1fr)310px}}@media(max-width:850px){.workspace{grid-template-columns:1fr}.preview-column{position:static}.timing-panel{margin-top:0}}
</style>
</head>
<body><main>
<h1>喵喵合唱 · 对轴设置</h1>
<p>51.30–65.83秒 · 60fps · <a href="index.html" target="_blank" rel="noopener">完整MV</a>。边听原曲边调节，改动立即显示。</p>
<div class="workspace"><section class="preview-column" aria-label="画面与播放">
<iframe id="svg-view" src="index.html?embed=1" title="喵喵合唱在原SVG模板中的预览"></iframe>
<section class="panel" aria-label="本段播放控制">
<div class="row">
<button id="play-segment" disabled>从A点播放</button><button id="toggle-play" class="secondary" disabled>继续播放</button>
<button id="previous-frame" class="secondary" disabled>上一帧</button><button id="next-frame" class="secondary" disabled>下一帧</button>
<button id="seek-55" class="secondary" disabled>55秒</button>
<label>速度 <select id="playback-rate" disabled><option value="0.25">0.25倍</option><option value="0.5">0.5倍</option><option value="0.75">0.75倍</option><option value="1" selected>1倍</option></select></label>
</div>
<div class="timeline"><input id="segment-seek" type="range" min="3078" max="3949" step="1" value="3300" aria-label="本段时间轴" disabled><output id="time-readout" class="time">55.000秒 · 第222帧</output></div>
<div class="row loop">
<label><input id="loop-enabled" type="checkbox" checked> 循环A–B</label>
<label>A点 <input id="loop-start" type="number" min="51.3" max="65.816667" step="0.001" value="51.300" disabled> 秒</label>
<button id="set-loop-start" class="secondary" disabled>当前设为A</button>
<label>B点 <input id="loop-end" type="number" min="51.316667" max="65.833333" step="0.001" value="65.833333" disabled> 秒</label>
<button id="set-loop-end" class="secondary" disabled>当前设为B</button>
<button id="reset-loop" class="secondary" disabled>循环整段</button>
</div>
<p class="hint keyboard">空格播放/暂停，←/→逐帧查看，Shift＋←/→跳10帧。可在听清某个“喵”后设置A、B点，反复比较。</p>
</section>
</section><section class="panel timing-panel" aria-label="喵喵动画对轴设置">
<h2>调整动画时间</h2>
<p><strong>正值提前，负值延后。</strong> 1帧＝16.67毫秒。先调整整段动画，再微调口型或吐字。</p>
<div id="timing-controls" class="timings"></div>
<p id="effective-offsets" class="hint time"></p>
<div class="row save">
<button id="save-timing" disabled>保存到工程</button><button id="export-timing" class="secondary" disabled>导出对轴JSON</button>
<button id="import-timing" class="secondary" disabled>导入对轴JSON</button><button id="reset-timing" class="secondary" disabled>恢复工程默认</button>
<input id="timing-file" type="file" accept=".json,application/json" hidden>
</div>
<p class="hint">保存到工程后，预览和视频导出都会读取同一份偏移设置。</p>
<p id="status" role="status" aria-live="polite">正在载入素材和音乐…</p>
</section>
</div>
</main><script type="module" src="app/player/timing-controls.js"></script></body>
</html>
